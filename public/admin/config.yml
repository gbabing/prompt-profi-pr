backend:
  name: github
  repo: gbabing/prompt-profi-pr
  branch: main
  base_url: https://prompt-profi-cms-auth.gbabing.workers.dev
  auth_endpoint: /auth

media_folder: "public/uploads"
public_folder: "/uploads"

locale: 'de'

collections:
  - name: "prompts"
    label: "Prompts"
    label_singular: "Prompt"
    folder: "src/content/prompts"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Kurzbeschreibung", name: "description", widget: "text", hint: "1-2 Sätze: Wann nutze ich diesen Prompt?" }
      - label: "Kategorie"
        name: "category"
        widget: "select"
        options:
           - "Krisenkommunikation"
           - "Pressemitteilungen"
           - "Strategische Konzeption"
           - "Social Media"
           - "Stakeholder-Mapping"
           - "Recherche & Analyse"
           - "Sprachliche Qualitätskontrolle"
        label: "Phase"
        name: "phase"
        widget: "select"
        options:
          - "Strategie"
          - "Umsetzung"
          - "Auswertung"
      - label: "Branche"
        name: "subject"
        widget: "select"
        -options:
          - "B2B"
          - "B2C"
          - "NGO"
          - "Öffentlicher Sektor"
          - "Politik"
          - "Branchenübergreifend"
      - label: "Prompt-Text"
        name: "prompt"
        widget: "text"
        hint: "Der eigentliche Prompt zum Kopieren. Platzhalter in [eckigen Klammern] kennzeichnen."
      - { label: "Reihenfolge (optional)", name: "order", widget: "number", required: false, hint: "Niedrigere Zahl = weiter oben. Leer = ans Ende." }
      - { label: "Body (wird nicht angezeigt)", name: "body", widget: "hidden", default: "" }
